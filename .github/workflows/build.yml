name: Android CI Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 使用声明 Node 24 运行时的 action，避免 Node 20 弃用警告（勿再设置 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24）
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 安装 Flutter
      # 须与 pubspec environment.sdk（^3.9.0）一致：Flutter 3.22 仅含 Dart 3.4，会导致 pub get 失败
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      # 安装依赖
      - name: Install dependencies
        run: flutter pub get

      # 接受 Android SDK license
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      # 构建 Release APK
      - name: Build APK
        id: build_apk
        run: flutter build apk --release --build-name=1.0.0 --build-number=1

      # 重命名 APK 并导出路径
      - name: Rename APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/final
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/final/WatchMsg.apk
          echo "APK_PATH=build/app/outputs/flutter-apk/final/WatchMsg.apk" >> $GITHUB_ENV

      # 上传 APK Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchMsg
          path: ${{ env.APK_PATH }}
